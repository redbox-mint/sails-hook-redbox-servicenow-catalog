networks:
  main:

x-rbportal-env: &rbportal-env
  - NODE_ENV=integrationtest
  - NODE_PATH=/opt/redbox-portal/node_modules:/opt/redbox-portal/node_modules/@researchdatabox/redbox-core/node_modules
  - PORT=1500
  - sails_redbox__mochaTesting=true
  - sails_security__csrf=false
  - LOAD_DEFAULT_FORMS=true
  - CI=${CI:-false}
  - RBPORTAL_COVERAGE_DIR=/tmp/coverage/mocha

x-rbportal-depends: &rbportal-depends
  mongodb:
    condition: service_healthy
  solr:
    condition: service_healthy

services:
  redboxportal:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: sails-hook-redbox-servicenow-catalog
    volumes:
      - "../../support/integration-testing:/opt/redbox-portal/support/integration-testing:ro"
      - "../../test/integration:/opt/redbox-portal/test/integration/sails-hook-redbox-servicenow-catalog"
    depends_on: *rbportal-depends
    expose:
      - "1500"
    environment: *rbportal-env
    networks:
      main:
        aliases:
          - redboxportal
    init: true
    entrypoint:
      - bash
      - /opt/redbox-portal/support/integration-testing/run-mocha-hook.sh

  mongodb:
    image: mongo:7
    networks:
      main:
        aliases:
          - mongodb
    healthcheck:
      test: ['CMD-SHELL', "echo 'db.runCommand(\"ping\").ok' | mongosh"]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'

  solr:
    image: solr:8.11.1
    expose:
      - "8983"
    healthcheck:
      test: ['CMD-SHELL', 'curl http://localhost:8983']
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
    networks:
      main:
        aliases:
          - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
